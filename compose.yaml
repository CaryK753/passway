services:
  web:
    build:
      context: .
    container_name: passway-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PASSWAY_PORT:-3100}:3000"
    environment:
      PASSWAY_PUBLIC_URL: ${PASSWAY_PUBLIC_URL:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
