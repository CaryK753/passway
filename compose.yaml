services:
  web:
    build:
      context: .
    container_name: passway-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PASSWAY_PORT:-3100}:3000"
    environment:
      PASSWAY_PUBLIC_URL: ${PASSWAY_PUBLIC_URL:-}
      WEKNORA_API_BASE: ${WEKNORA_API_BASE:-}
      WEKNORA_API_KEY: ${WEKNORA_API_KEY:-}
      WEKNORA_KNOWLEDGE_BASE_ID: ${WEKNORA_KNOWLEDGE_BASE_ID:-}
      WEKNORA_EMBED_CHANNEL_ID: ${WEKNORA_EMBED_CHANNEL_ID:-}
      WEKNORA_EMBED_PUBLISH_TOKEN: ${WEKNORA_EMBED_PUBLISH_TOKEN:-}
      NEXT_PUBLIC_WEKNORA_BASE_URL: ${NEXT_PUBLIC_WEKNORA_BASE_URL:-}
      NEXT_PUBLIC_WEKNORA_EMBED_CHANNEL_ID: ${NEXT_PUBLIC_WEKNORA_EMBED_CHANNEL_ID:-}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
